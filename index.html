<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TopoGirassol</title>
  <link rel="manifest" href="manifest.json">
  <script>
   const CDN = 'https://' + 'unpkg' + '.com/';
    document.write('<link rel="stylesheet" href="' + CDN + 'leaflet@1.9.4/dist/leaflet.css">');
    document.write('<script src="' + CDN + 'leaflet@1.9.4/dist/leaflet.js"><\/script>');
    document.write('<script src="' + CDN + 'sql.js@1.8.0/dist/sql-wasm.js"><\/script>');
    document.write('<script src="' + CDN + 'leaflet.tilelayer.mbtiles@1.0.2/Leaflet.TileLayer.MBTiles.js"><\/script>');
  </script>
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    #panel {
      position: absolute; top: 10px; right: 10px; z-index: 1000;
      background: white; padding: 12px; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3); font-size: 14px;
    }
    label { display: block; margin-bottom: 6px; cursor: pointer; }
    #btn-gps {
      position: absolute; bottom: 25px; right: 15px; z-index: 1000;
      background: #2e7d32; color: white; border: none; padding: 14px;
      border-radius: 50%; font-size: 18px; box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>
  <div id="panel">
    <strong>Planos de Campo</strong><br><br>
    <label><input type="checkbox" id="chk-general" checked> Mapa General</label>
    <label><input type="checkbox" id="chk-curvas"> Curvas de Nivel</label>
    <label><input type="checkbox" id="chk-cables"> Cables / Red</label>
  </div>
  <button id="btn-gps" title="Mi ubicación">📍</button>
  <div id="map"></div>

  <script>
    // Cambia estas coordenadas por el centro de Fazenda Girassol (Latitud, Longitud)
    const map = L.map('map').setView([-7.72085, 13.33999], 14);

    const capaGeneral = L.tileLayer.mbTiles('mapageneral2.mbtiles', { maxZoom: 19 }).addTo(map);
    const capaCurvas = L.tileLayer.mbTiles('curvas4.mbtiles', { maxZoom: 19 });
    const capaCables = L.tileLayer.mbTiles('cables.mbtiles', { maxZoom: 19 });

    const vincularCapa = (idCheckbox, capa) => {
      document.getElementById(idCheckbox).addEventListener('change', (e) => {
        if (e.target.checked) map.addLayer(capa);
        else map.removeLayer(capa);
      });
    };
    vincularCapa('chk-general', capaGeneral);
    vincularCapa('chk-curvas', capaCurvas);
    vincularCapa('chk-cables', capaCables);

    let marcadorGPS, circuloPrecision;
    document.getElementById('btn-gps').addEventListener('click', () => {
      map.locate({ setView: true, maxZoom: 18, watch: true, enableHighAccuracy: true });
    });

    map.on('locationfound', (e) => {
      const radio = e.accuracy / 2;
      if (!marcadorGPS) {
        marcadorGPS = L.circleMarker(e.latlng, { radius: 8, fillColor: '#1976d2', color: '#fff', weight: 2, fillOpacity: 1 }).addTo(map);
        circuloPrecision = L.circle(e.latlng, radio, { color: '#1976d2', fillOpacity: 0.15, weight: 1 }).addTo(map);
      } else {
        marcadorGPS.setLatLng(e.latlng);
        circuloPrecision.setLatLng(e.latlng).setRadius(radio);
      }
    });

    map.on('locationerror', () => alert('Activa el GPS de tu teléfono para ubicarte en el lote.'));

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
